{{- /* Root-relative images ("/img/x.png") are resolved against baseURL. */ -}}
{{- $src := .Destination -}}
{{- if and (hasPrefix $src "/") (not (hasPrefix $src "//")) -}}
  {{- $src = strings.TrimPrefix "/" $src | relURL -}}
{{- end -}}
<img src="{{ $src | safeURL }}" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy">
{{- /**/ -}}
