{{- /* "Signals into knowledge" — the logo's data modalities, made explicit.
       Self-contained inline SVG; scales by viewBox, no fragile positioning. */ -}}
<section class="modalities" aria-labelledby="mod-title">
  <div class="mod-copy">
    <div class="section-head"><h2 id="mod-title">{{ i18n "mod_title" }}</h2></div>
    <p>{{ i18n "mod_body" }}</p>
    <a class="more-link" href="{{ "/research/" | relLangURL }}">{{ i18n "mod_cta" }} →</a>
  </div>

  <figure class="mod-figure">
    <svg viewBox="0 0 600 360" aria-label="Data modalities diagram">
      <!-- connectors -->
      <g class="mod-conns" aria-hidden="true">
        <path class="mod-conn" d="M172 30  C290 30  320 180 428 180"/>
        <path class="mod-conn" d="M172 80  C290 80  320 180 428 180"/>
        <path class="mod-conn" d="M172 130 C300 130 330 180 428 180"/>
        <path class="mod-conn" d="M172 180 L428 180"/>
        <path class="mod-conn" d="M172 230 C300 230 330 180 428 180"/>
        <path class="mod-conn" d="M172 280 C290 280 320 180 428 180"/>
        <path class="mod-conn" d="M172 330 C290 330 320 180 428 180"/>
      </g>

      <!-- modality rows -->
      <g class="mod-rows">
        <!-- Text -->
        <a href="{{ "/research/#natural-language-understanding-search" | relLangURL }}" aria-label="{{ i18n "mod_text" }}">
          <g class="mod-row">
            <text class="mod-label" x="126" y="34" text-anchor="end">{{ i18n "mod_text" }}</text>
            <g class="mod-icon" transform="translate(140 18)">
              <path d="M4 6h16M4 12h16M4 18h10"/>
            </g>
          </g>
        </a>

        <!-- Dialogue -->
        <a href="{{ "/research/#natural-language-understanding-search" | relLangURL }}" aria-label="{{ i18n "mod_dialogue" }}">
          <g class="mod-row">
            <text class="mod-label" x="126" y="84" text-anchor="end">{{ i18n "mod_dialogue" }}</text>
            <g class="mod-icon" transform="translate(140 68)">
              <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v7A1.5 1.5 0 0 1 19.5 15H10l-4.5 4V15H4.5A1.5 1.5 0 0 1 3 13.5z"/>
              <circle class="fill" cx="8" cy="10" r="1"/><circle class="fill" cx="12" cy="10" r="1"/><circle class="fill" cx="16" cy="10" r="1"/>
            </g>
          </g>
        </a>

        <!-- Image -->
        <a href="{{ "/research/#multimedia-recognition-retrieval" | relLangURL }}" aria-label="{{ i18n "mod_image" }}">
          <g class="mod-row">
            <text class="mod-label" x="126" y="134" text-anchor="end">{{ i18n "mod_image" }}</text>
            <g class="mod-icon" transform="translate(140 118)">
              <rect x="3" y="4" width="18" height="16" rx="2"/>
              <circle cx="8.5" cy="9.5" r="1.8"/>
              <path d="M3 17l5-4 4 3 3-3 6 4"/>
            </g>
          </g>
        </a>

        <!-- Audio -->
        <a href="{{ "/research/#multimedia-recognition-retrieval" | relLangURL }}" aria-label="{{ i18n "mod_audio" }}">
          <g class="mod-row">
            <text class="mod-label" x="126" y="184" text-anchor="end">{{ i18n "mod_audio" }}</text>
            <g class="mod-icon" transform="translate(140 168)">
              <path d="M4 9.5h3l4-3.5v12l-4-3.5H4z"/>
              <path d="M15 9a4 4 0 0 1 0 6"/><path d="M17.6 7a7 7 0 0 1 0 10"/>
            </g>
          </g>
        </a>

        <!-- Video -->
        <a href="{{ "/research/#multimedia-recognition-retrieval" | relLangURL }}" aria-label="{{ i18n "mod_video" }}">
          <g class="mod-row">
            <text class="mod-label" x="126" y="234" text-anchor="end">{{ i18n "mod_video" }}</text>
            <g class="mod-icon" transform="translate(140 218)">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <path class="fill" d="M10 9l5.5 3-5.5 3z"/>
            </g>
          </g>
        </a>

        <!-- Tables -->
        <a href="{{ "/research/#natural-language-understanding-search" | relLangURL }}" aria-label="{{ i18n "mod_table" }}">
          <g class="mod-row">
            <text class="mod-label" x="126" y="284" text-anchor="end">{{ i18n "mod_table" }}</text>
            <g class="mod-icon" transform="translate(140 268)">
              <rect x="3" y="4" width="18" height="16" rx="1.5"/>
              <path d="M3 9.5h18M3 14.5h18M9 4.5v15M15 4.5v15"/>
            </g>
          </g>
        </a>

        <!-- Signals -->
        <a href="{{ "/research/#multimedia-recognition-retrieval" | relLangURL }}" aria-label="{{ i18n "mod_signal" }}">
          <g class="mod-row">
            <text class="mod-label" x="126" y="334" text-anchor="end">{{ i18n "mod_signal" }}</text>
            <g class="mod-icon" transform="translate(140 318)">
              <path d="M2 12h3l2.5-7 3.5 14 3-9 2 4h5"/>
            </g>
          </g>
        </a>
      </g>

      <!-- node + sprout -->
      <g class="mod-node" aria-hidden="true">
        <circle class="node-glow" cx="430" cy="180" r="27"/>
        <circle class="node" cx="430" cy="180" r="13"/>
        <circle class="node-core" cx="430" cy="180" r="5"/>
        <path class="sprout" d="M430 167v-9M430 160q-7 0-10-6 6 0 10 4M430 158q5-2 9-7-2 6-9 7"/>
      </g>
      <text class="mod-out" x="430" y="214" text-anchor="middle">{{ i18n "mod_knowledge" }}</text>
    </svg>
  </figure>
</section>
