{{ with hugo.Data.funding }}
<section class="funding">
  <div class="section-head"><h2>{{ i18n "funding_title" }}</h2></div>
  <div class="funding-logos">
    {{ range . }}
      <a href="{{ .url }}" target="_blank" rel="noopener" title="{{ .name }}">
        <img src="{{ .logo | relURL }}" alt="{{ .name }}" loading="lazy">
      </a>
    {{ end }}
  </div>
</section>
{{ end }}
