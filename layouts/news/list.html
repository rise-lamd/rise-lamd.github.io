{{ define "main" }}
<article class="prose">
  <h1>{{ .Title }}</h1>
  <div class="signal-rule" aria-hidden="true"></div>
  {{ .Content }}
</article>

<section class="news">
  {{ range $index, $element := .Pages.ByDate.Reverse }}
    <article class="news-item" style="--i: {{ $index }}">
      <span class="news-date">{{ .Date.Format "2006-01-02" }}</span>
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
      <a class="more-link" href="{{ .RelPermalink }}" aria-label="{{ i18n "news_readmore" }}: {{ .Title }}">{{ i18n "news_readmore" }} →</a>
    </article>
  {{ end }}
</section>
{{ end }}
