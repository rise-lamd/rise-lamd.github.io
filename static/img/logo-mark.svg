<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 146" role="img" aria-label="RISE-LAMD — seven data modalities converge into one knowledge node">
  <title>RISE-LAMD</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3f73"/>
      <stop offset="0.4" stop-color="#2566a8"/>
      <stop offset="0.66" stop-color="#15a7cf"/>
      <stop offset="1" stop-color="#1a9e7a"/>
    </linearGradient>
    <style>
      .s    { fill:none; stroke:url(#brand); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .fill { fill:url(#brand); stroke:none; }
      .ray  { fill:none; stroke:url(#brand); stroke-width:1.4; stroke-dasharray:1 6; stroke-linecap:round; opacity:0.5; }
      .node { fill:#15a7cf; }
      .glow { fill:#15a7cf; opacity:0.16; }
      .core { fill:#ffffff; }
      .grow { fill:none; stroke:#1a9e7a; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    </style>

    <g id="ic-text" class="s"><path d="M4 6h16M4 12h16M4 18h10"/></g>
    <g id="ic-dialogue" class="s">
      <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v7A1.5 1.5 0 0 1 19.5 15H10l-4.5 4V15H4.5A1.5 1.5 0 0 1 3 13.5z"/>
      <circle class="fill" cx="8" cy="10" r="1"/><circle class="fill" cx="12" cy="10" r="1"/><circle class="fill" cx="16" cy="10" r="1"/>
    </g>
    <g id="ic-image" class="s">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <circle cx="8.5" cy="9.5" r="1.8"/>
      <path d="M3 17l5-4 4 3 3-3 6 4"/>
    </g>
    <g id="ic-audio" class="s">
      <path d="M4 9.5h3l4-3.5v12l-4-3.5H4z"/>
      <path d="M15 9a4 4 0 0 1 0 6"/><path d="M17.6 7a7 7 0 0 1 0 10"/>
    </g>
    <g id="ic-video" class="s">
      <rect x="2" y="5" width="20" height="14" rx="2"/>
      <path class="fill" d="M10 9l5.5 3-5.5 3z"/>
    </g>
    <g id="ic-table" class="s">
      <rect x="3" y="4" width="18" height="16" rx="1.5"/>
      <path d="M3 9.5h18M3 14.5h18M9 4.5v15M15 4.5v15"/>
    </g>
    <g id="ic-signal" class="s"><path d="M2 12h3l2.5-7 3.5 14 3-9 2 4h5"/></g>
  </defs>

  <!-- rays: node -> each modality -->
  <g class="ray">
    <path d="M72 54 72 15"/>
    <path d="M72 54 29 27"/>
    <path d="M72 54 115 27"/>
    <path d="M72 54 17 57"/>
    <path d="M72 54 127 57"/>
    <path d="M72 54 29 87"/>
    <path d="M72 54 115 87"/>
  </g>

  <!-- modality icons -->
  <use href="#ic-text"     x="60" y="3"/>
  <use href="#ic-dialogue" x="17" y="15"/>
  <use href="#ic-image"    x="103" y="15"/>
  <use href="#ic-audio"    x="5"  y="45"/>
  <use href="#ic-video"    x="115" y="45"/>
  <use href="#ic-table"    x="17" y="75"/>
  <use href="#ic-signal"   x="103" y="75"/>

  <!-- stem descenders -->
  <path class="s" d="M68 64V96M72 65V97M76 64V96" stroke-width="1.7" opacity="0.85"/>

  <!-- sprout at the base -->
  <g class="grow">
    <path d="M72 93q-7-1-9-6 7 1 9 5"/>
    <path d="M72 90q7-1 9-7-1 6-9 7"/>
  </g>

  <!-- floating island -->
  <g class="s">
    <path d="M44 97Q72 91 100 97Q72 103 44 97Z"/>
    <path d="M44 97 72 133 100 97"/>
    <path d="M58 100 72 133M86 100 72 133" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- knowledge node -->
  <circle class="glow" cx="72" cy="54" r="17"/>
  <circle class="node" cx="72" cy="54" r="9"/>
  <circle class="core" cx="72" cy="54" r="3.4"/>
</svg>
