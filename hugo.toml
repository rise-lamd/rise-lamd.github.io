# ============================================================
#  Site configuration
#  Most things you'll change day-to-day are NOT here — they live
#  in the data/ folder and content/ files. See CONTRIBUTING.md.
# ============================================================

baseURL = "https://rise-lamd.github.io/"
title = "RISE-LAMD"                           # group short name, shown in browser tab
defaultContentLanguage = "pt"
defaultContentLanguageInSubdir = false

# Pretty URLs and good defaults
enableEmoji = true
enableGitInfo = true   # lets templates show "last updated" from git history

[params]
  groupNameFull = "RISE-LAMD — Recognition, Inference and Search on Language and Multimedia Data"
  groupNameShort = "RISE-LAMD"
  institution = "UNESP — Universidade Estadual Paulista “Júlio de Mesquita Filho”"
  email = "rise.lamd@unesp.br"
  # Edit the rest of the contact details in data/contact.yaml

# ------------------------------------------------------------
#  Languages — Portuguese + English
# ------------------------------------------------------------
[languages]
  [languages.pt]
    label = "Português"
    locale = "pt-BR"
    weight = 1
    [languages.pt.params]
      flag = "br"
      tagline = "Reconhecimento, inferência e busca em dados de linguagem e multimídia — processamento de linguagem natural, visão computacional e recuperação de informação."
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 2
    [languages.en.params]
      flag = "us"
      tagline = "Recognition, inference, and search over language and multimedia data — natural language processing, computer vision, and information retrieval."

# ------------------------------------------------------------
#  Navigation menu — shared structure, labels are translated
#  in i18n/en.toml and i18n/pt.toml (keys below).
# ------------------------------------------------------------
[menus]
  [[menus.main]]
    identifier = "home"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    identifier = "about"
    pageRef = "/about"
    weight = 2
  [[menus.main]]
    identifier = "people"
    pageRef = "/people"
    weight = 3
  [[menus.main]]
    identifier = "research"
    pageRef = "/research"
    weight = 4
  [[menus.main]]
    identifier = "publications"
    pageRef = "/publications"
    weight = 5
  [[menus.main]]
    identifier = "news"
    pageRef = "/news"
    weight = 6
  [[menus.main]]
    identifier = "opportunities"
    pageRef = "/opportunities"
    weight = 7
  [[menus.main]]
    identifier = "contact"
    pageRef = "/contact"
    weight = 8

[markup.goldmark.renderer]
  unsafe = true   # allow raw HTML in markdown (used sparingly in content)

[taxonomies]
  topic = "topics"
