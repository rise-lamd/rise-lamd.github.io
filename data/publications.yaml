# ── 2026 ────────────────────────────────────────────────────

- title: "A Manifold-Aware Topic Modeling Approach via Rank-Based Prototypes"
  authors: "Thiago César Castilho Almeida; Daniel Carlos Guimarães Pedronette"
  venue: "Empirical Methods in Natural Language Processing (EMNLP)"
  year: 2026
  type: conference
  featured: true
  showcase: true
  summary:
    en: "MARETopic is a training-free topic model that casts topic discovery as rank-based prototype selection, electing real corpus documents as interpretable topic leaders via manifold learning and rank correlation."
    pt: "O MARETopic é um modelo de tópicos livre de treinamento que formula a descoberta de tópicos como uma seleção de protótipos baseada em rankings, elegendo documentos reais do corpus como líderes interpretáveis por meio de aprendizado em variedades e correlação de rankings."
  highlights:
    en:
      - "Training-free and interpretable by construction: each topic is anchored on a real leader document from the corpus."
      - "Selects exactly K topics on low-dimensional manifolds using rank-based neighborhood agreement, avoiding hubness and anisotropy."
      - "Combines c-TF-IDF with inter-topic Maximal Marginal Relevance (MMR) to penalize word overlap and extract highly diverse, distinctive keywords."
    pt:
      - "Livre de treinamento e interpretável por construção: cada tópico é ancorado em um documento líder real do corpus."
      - "Seleciona exatamente K tópicos em variedades de baixa dimensionalidade usando concordância de vizinhança baseada em ranking, mitigando 'hubness' e anisotropia."
      - "Combina c-TF-IDF com Maximal Marginal Relevance (MMR) inter-tópicos para penalizar sobreposição de vocabulário e extrair palavras-chave altamente diversas e distintas."
  visual:
    src: "/img/publications/maretopic/maretopic-pipeline.png"
    alt:
      en: "Eight-step MARETopic pipeline, from text corpus to K topics via Sentence-BERT, UMAP manifold, ranked lists, greedy leader selection, and C-TF-IDF + MMR."
      pt: "Pipeline em oito etapas do MARETopic, do corpus textual até K tópicos via Sentence-BERT, variedade UMAP, listas ranqueadas, seleção gulosa de líderes e C-TF-IDF + MMR."
    caption:
      en: "MARETopic pipeline: manifold-aware and rank-based prototype selection for topic modeling."
      pt: "Pipeline do MARETopic: seleção de protótipos baseada em rankings e variedades para modelagem de tópicos."
  doi: ""
  arxiv: "https://arxiv.org/abs/2609.29630"
  pdf: "https://arxiv.org/pdf/2609.29630"
  code: "https://github.com/thcastilho/maretopic"

- title: "Aggregating Neighbor Embedding Projection and Rank-Based Manifold Learning for Image Retrieval"
  authors: "Vinicius Atsushi Sato Kawai; Gustavo Rosseto Leticio; Lucas Pascotti Valem; Daniel Carlos Guimarães Pedronette"
  venue: "Journal of the Brazilian Computer Society (JBCS)"
  year: 2026
  type: journal
  featured: false
  showcase: true
  summary:
    en: "An unsupervised image retrieval approach that aggregates the ranked lists from a UMAP-based Neighbor Embedding Projection with those refined by rank-based manifold learning, then re-ranks the fused result to obtain the final retrieval."
    pt: "Uma abordagem não supervisionada de recuperação de imagens que agrega as listas ranqueadas de uma Projeção de Embeddings de Vizinhança baseada em UMAP com aquelas refinadas por aprendizado de variedades baseado em rankings, reordenando o resultado combinado para obter a recuperação final."
  highlights:
    en:
      - "Two complementary branches over the same CNN/Transformer features: rank-based manifold re-ranking in the original space and indexing over a low-dimensional UMAP projection."
      - "Fuses both ranked lists with Borda count rank aggregation, followed by a final manifold learning re-ranking step."
    pt:
      - "Dois ramos complementares sobre as mesmas características de CNNs/Transformers: reordenação por aprendizado de variedades no espaço original e indexação sobre uma projeção UMAP de baixa dimensionalidade."
      - "Combina as duas listas ranqueadas por agregação de rankings via Borda count, seguida de uma etapa final de reordenação por aprendizado de variedades."
  visual:
    src: "/img/publications/jbcs2026-nep-aggregation/nep-aggregation-pipeline.png"
    alt:
      en: "Methodology diagram: an image dataset goes through feature extraction into high-dimensional embeddings, which feed two branches (indexing plus manifold learning re-ranking, and UMAP projection plus indexing); their ranked lists are combined by Borda count and re-ranked by manifold learning into the final retrieval result."
      pt: "Diagrama da metodologia: um conjunto de imagens passa por extração de características gerando embeddings de alta dimensionalidade, que alimentam dois ramos (indexação com reordenação por aprendizado de variedades, e projeção UMAP com indexação); as listas ranqueadas são combinadas por Borda count e reordenadas por aprendizado de variedades até o resultado final."
    caption:
      en: "Aggregating Neighbor Embedding Projection and rank-based manifold learning for image retrieval."
      pt: "Agregação da Projeção de Embeddings de Vizinhança com aprendizado de variedades baseado em rankings para recuperação de imagens."
  doi: "https://doi.org/10.5753/jbcs.2026.5685"
  pdf: "https://journals-sol.sbc.org.br/index.php/jbcs/article/view/5685"

- title: "Context-Aware Intent Retrieval and Classification Based on Graph Convolutional Networks"
  authors: "Vinicius Atsushi Sato Kawai; Gustavo Rosseto Letício; Manuel Esteban Ramirez Carrillo; André Freitas; Daniel Carlos Guimarães Pedronette"
  venue: "International Conference on Artificial Neural Networks (ICANN)"
  year: 2026
  type: conference
  featured: true
  showcase: true
  summary:
    en: "A framework for intent detection that refines the neighborhood structure of dense textual embeddings through unsupervised manifold-based strategies, then uses the refined graphs to support semi-supervised intent classification with Graph Convolutional Networks."
    pt: "Um framework para detecção de intenções que refina a estrutura de vizinhança de embeddings textuais densos por meio de estratégias não supervisionadas baseadas em variedades, usando os grafos refinados para apoiar a classificação semi-supervisionada de intenções com Graph Convolutional Networks."
  highlights:
    en:
      - "Targets noisy similarity relationships in high-dimensional embedding spaces, common for short and semantically overlapping utterances."
      - "Refines neighborhoods via manifold learning re-ranking and Neighbor Embedding Projection before building the graph used by the GCN."
      - "Refined neighborhood structures yield more reliable graphs and improved classification accuracy on standard intent detection benchmarks."
    pt:
      - "Aborda relações de similaridade ruidosas em espaços de embeddings de alta dimensionalidade, comuns em enunciados curtos e semanticamente sobrepostos."
      - "Refina as vizinhanças por reordenação com aprendizado de variedades e Projeção de Embeddings de Vizinhança antes de construir o grafo usado pela GCN."
      - "Estruturas de vizinhança refinadas produzem grafos mais confiáveis e maior acurácia de classificação em benchmarks padrão de detecção de intenções."
  visual:
    src: "/img/publications/icann2026-intent-gcn/icann2026-pipeline.png"
    alt:
      en: "Methodology diagram: dataset embeddings are indexed directly and re-ranked by manifold learning, or projected with UMAP-based Neighbor Embedding Projection and then indexed; the retrieval results are modeled as a graph that a Graph Convolutional Network uses to produce classification results."
      pt: "Diagrama da metodologia: os embeddings do conjunto de dados são indexados diretamente e reordenados por aprendizado de variedades, ou projetados via Projeção de Embeddings de Vizinhança baseada em UMAP e então indexados; os resultados de recuperação são modelados como um grafo que uma Graph Convolutional Network usa para produzir a classificação."
    caption:
      en: "Context-aware intent retrieval and GCN-based classification pipeline."
      pt: "Pipeline de recuperação de intenções sensível ao contexto e classificação baseada em GCN."
  doi: "https://doi.org/10.1007/978-3-032-38410-2_57"
  pdf: "https://link.springer.com/content/pdf/10.1007/978-3-032-38410-2_57.pdf"

