# ── 2024 ────────────────────────────────────────────────────

- title: "Rank-based Hashing for Effective and Efficient Nearest Neighbor Search for Image Retrieval"
  authors: "Vinicius Sato Kawai; Lucas Pascotti Valem; Alexandro Baldassin; Edson Borin; Daniel Carlos Guimarães Pedronette; Longin Jan Latecki"
  venue: "ACM Transactions on Multimedia Computing, Communications and Applications (TOMM)"
  year: 2024
  type: journal
  featured: false
  showcase: true
  summary:
    en: "A rank-based hashing approach for nearest neighbor search that indexes images by ranking each feature dimension, retrieves candidates per feature, aggregates them, and refines the result with distance distillation re-ranking."
    pt: "Uma abordagem de hashing baseada em rankings para busca de vizinhos mais próximos que indexa imagens ranqueando cada dimensão de característica, recupera candidatos por característica, os agrega e refina o resultado com reordenação por destilação de distâncias."
  highlights:
    en:
      - "Builds one ranking per feature dimension of CNN/Transformer representations, enabling fast lookup of the query's neighbors by feature."
      - "Aggregates the per-feature neighborhoods into a candidate set and re-ranks it with distance distillation for effective and efficient retrieval."
    pt:
      - "Constrói um ranking por dimensão das representações de CNNs/Transformers, permitindo a busca rápida dos vizinhos da consulta por característica."
      - "Agrega as vizinhanças por característica em um conjunto de candidatos e as reordena por destilação de distâncias, obtendo recuperação eficaz e eficiente."
  visual:
    src: "/img/publications/rank-hashing/rank-hashing-pipeline.png"
    alt:
      en: "Five-step Rank-based Hashing pipeline: feature extraction into d-dimensional vectors, feature ranking per dimension, query neighbors by feature, rank aggregation, and distance distillation re-ranking producing the final rank."
      pt: "Pipeline do Rank-based Hashing em cinco etapas: extração de características em vetores d-dimensionais, ranqueamento por dimensão, vizinhos da consulta por característica, agregação de rankings e reordenação por destilação de distâncias, gerando o ranking final."
    caption:
      en: "Rank-based Hashing pipeline for nearest neighbor search in image retrieval."
      pt: "Pipeline do Rank-based Hashing para busca de vizinhos mais próximos em recuperação de imagens."
  doi: "https://doi.org/10.1145/3659580"
  pdf: ""

