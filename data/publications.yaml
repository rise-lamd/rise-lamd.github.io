- title: "Effective Graph and Rank-based Contextual Embeddings for Textual and Multimedia Data"
  authors: "Thiago César Castilho Almeida; Gustavo Rosseto Letício; Lucas Pascotti Valem; André Freitas; Daniel Carlos Guimarães Pedronette"
  venue: "International Joint Conference on Neural Networks (IJCNN)"
  year: 2025
  type: conference
  featured: true
  showcase: true
  summary:
    en: "GRaCE is a fully unsupervised framework that uses rank-based measures to select representative nodes and construct interpretable contextual embeddings for textual and multimedia data."
    pt: "O GRaCE é um framework totalmente não supervisionado que utiliza medidas baseadas em rankings para selecionar nós representativos e construir embeddings contextuais interpretáveis para dados textuais e multimídia."
  highlights:
    en:
      - "Constructs low-dimensional embeddings whose dimensions are tied to representative elements from the collection."
      - "Selects effective, non-redundant representatives and evaluates the embeddings in retrieval, classification, and clustering."
    pt:
      - "Constrói embeddings de baixa dimensionalidade cujas dimensões estão associadas a elementos representativos da coleção."
      - "Seleciona representantes eficazes e não redundantes e avalia os embeddings em recuperação, classificação e agrupamento."
  visual:
    src: "/img/publications/grace/grace-pipeline.png"
    alt:
      en: "Seven-step GRaCE pipeline, from a textual or multimedia collection to interpretable low-dimensional node embeddings."
      pt: "Pipeline do GRaCE em sete etapas, de uma coleção textual ou multimídia até embeddings interpretáveis de nós em baixa dimensionalidade."
    caption:
      en: "GRaCE pipeline for textual and multimedia data."
      pt: "Pipeline do GRaCE para dados textuais e multimídia."
