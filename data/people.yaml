# ============================================================
#  PEOPLE  —  the single source of truth for the team page.
#  To add someone: copy a block, fill it in, save. That's it.
#  - Bilingual fields use  { en: "...", pt: "..." }
#  - photo: put the image in  static/img/people/  and reference it
#    as  /img/people/filename.jpg  (square photos look best, ~400x400)
#  - When a member graduates/leaves, just change  alumni: false -> true
#    and fill in  now:  (their current position).
#  - Order within each group follows  weight  (lower = higher up).
# ============================================================

- name: "Prof. Dr. Advisor Name"
  pi: true                       # the Principal Investigator (only one)
  weight: 1
  photo: "/img/placeholder.svg"
  role:
    en: "Principal Investigator · Associate Professor"
    pt: "Pesquisador Responsável · Professor Associado"
  interests:
    en: "Machine learning, optimization, applied AI for engineering."
    pt: "Aprendizado de máquina, otimização, IA aplicada à engenharia."
  email: "advisor@unesp.br"
  links:
    lattes: "http://lattes.cnpq.br/XXXXXXXX"
    scholar: "https://scholar.google.com/citations?user=XXXX"
    orcid: "https://orcid.org/0000-0000-0000-0000"

